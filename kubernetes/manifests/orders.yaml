apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-deployment
  namespace: default
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: zerotrustack.azurecr.io/orders:latest
        ports:
        - containerPort: 5001
        env:
        - name: PRODUCTS_URL
          value: "http://products-service:5000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: default
spec:
  selector:
    app: orders
  ports:
  - port: 5001
    targetPort: 5001
  type: ClusterIP
