apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-deployment
  namespace: default
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: orders-sa
      containers:
      - name: orders
        image: zerotrustack.azurecr.io/orders:latest
        ports:
        - containerPort: 5001
        env:
        - name: PRODUCTS_URL
          value: "http://products-service:5000"
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "orders-secrets"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: default
spec:
  selector:
    app: orders
  ports:
  - port: 5001
    targetPort: 5001
  type: ClusterIP
