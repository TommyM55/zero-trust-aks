apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-deployment
  namespace: default
  labels:
    app: products
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - name: products
        image: zerotrustack.azurecr.io/products:latest
        ports:
        - containerPort: 5000
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 2"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: default
spec:
  selector:
    app: products
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
