assertNoLeakedSecrets: false

service:
  type: LoadBalancer
  port: 80

persistence:
  enabled: false

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s/"
  auth:
    disable_login_form: false
  auth.azuread:
    name: Azure AD
    enabled: true
    allow_sign_up: true
    client_id: "2416e30d-b110-4770-a3f5-941d4778a656"
    client_secret: "${GRAFANA_CLIENT_SECRET}"
    scopes: openid email profile
    auth_url: "https://login.microsoftonline.com/c315082a-356f-4c20-88e5-5681b00e0444/oauth2/v2.0/authorize"
    token_url: "https://login.microsoftonline.com/c315082a-356f-4c20-88e5-5681b00e0444/oauth2/v2.0/token"
    allowed_domains: ""
    allowed_groups: ""

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      isDefault: true
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 7249
      revision: 1
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 6336
      revision: 1
      datasource: Prometheus
